id: PQL-ALB-001
title: ALB Listener lacks post-quantum hybrid TLS policy
resource_type: aws_lb_listener
condition:
  attribute: ssl_policy
  not_in: [ELBSecurityPolicy-TLS13-1-2-Ext1-2021-06, ELBSecurityPolicy-TLS13-1-3-PQ-2023-06]
exposure: confidentiality
base_severity: critical
message: "Listener uses {value} instead of a hybrid PQ TLS policy, exposing traffic to harvest-now-decrypt-later attacks."
references:
  - "AWS Post-Quantum Cryptography documentation"
remediation_ref: nlb_pq_tls
